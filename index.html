<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOBAL CAR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{border-color:var(--ac) !important;box-shadow:0 10px 28px rgba(0,0,0,.35);transform:translateY(-4px)}
.card svg{transition:transform .4s ease}
.card:hover svg{transform:translateX(8px) scale(1.05)}
button,a{transition:transform .15s ease,filter .15s ease,background-color .2s ease,border-color .2s ease}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.enter main section,.enter main section>*{animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) both}
.enter main section:nth-child(2){animation-delay:.08s}
.enter main section:nth-child(3){animation-delay:.16s}
.enter main section:nth-child(n+4){animation-delay:.24s}
[style*="top:70px"]{animation:pop .18s ease-out}
[aria-label="AI assistant"],[aria-expanded]{will-change:transform}
@media(max-width:700px){[aria-label=Theme]{bottom:84px !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.tile:hover{background:var(--surf2) !important}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="--bg:{{th.bg}};--surf:{{th.surf}};--surf2:{{th.surf2}};--bd:{{th.bd}};--bd2:{{th.bd2}};--mut:{{th.mut}};--tx:{{th.tx}};--ac:{{th.ac}};--ac2:{{th.ac2}};--g1:{{th.g1}};--g2:{{th.g2}};--t1:{{th.t1}};--t2:{{th.t2}};--t3:{{th.t3}};--line:{{th.line}};min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:16px;line-height:1.5">

<!-- HEADER -->
<header style="background:#0A0A0B;border-bottom:1px solid var(--line)">
<div style="max-width:1160px;margin:0 auto;padding:10px 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px">
<div style="justify-self:start"><div style="position:relative">
<button onClick="{{toggleLang}}" aria-label="Language" aria-expanded="{{langOpen}}" style="min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #6F86A3;background:transparent;color:#FFFFFF;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Inter',sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19"/></svg>{{curLang}}</button>
<template data-if="langOpen">
<div style="position:fixed;left:28px;top:70px;z-index:60;min-width:150px;max-width:calc(100vw - 32px);background:#151A20;border:1px solid #3A4552;border-radius:12px;padding:6px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.4)">
<template data-for="langs" data-as="l">
<button onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="text-align:left;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:{{l.bg}};color:{{l.fg}};font:600 14px 'Inter',sans-serif">{{l.name}}</button>
</template>
</div>
</template>
</div></div>
<button onClick="{{goHome}}" aria-label="{{brand}}" style="background:none;border:0;padding:0;min-height:56px;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ac);font:700 clamp(15px,4.5vw,20px)/1 'Space Grotesk',sans-serif;white-space:nowrap;letter-spacing:.02em"><img src="logo-mark.png" alt="" style="height:clamp(34px,10vw,46px);width:auto;display:block"><span>{{brand}}</span></button>
<div style="justify-self:end"><div style="position:relative">
<button onClick="{{toggleMenu}}" aria-label="Menu" aria-expanded="{{menuOpen}}" style="width:46px;min-height:44px;border-radius:999px;border:1px solid #6F86A3;background:transparent;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<template data-if="menuOpen">
<nav aria-label="Main" style="position:fixed;right:28px;top:70px;z-index:60;min-width:220px;max-width:calc(100vw - 32px);background:#151A20;border:1px solid #3A4552;border-radius:12px;padding:6px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.4)">
<template data-for="navItems" data-as="n">
<button onClick="{{n.pick}}" style="text-align:left;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#FFFFFF;font:600 15px 'Inter',sans-serif;border-left:3px solid {{n.bb}}">{{n.label}}</button>
</template>
</nav>
</template>
</div></div>
</div>
</header>

<main>

<!-- ============ HOME ============ -->
<template data-if="isHome">
<section style="max-width:1160px;margin:0 auto;padding:64px 24px 32px;display:flex;flex-wrap:wrap;gap:40px;align-items:stretch">
<div style="flex:1 1 440px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:20px">
<h1 style="margin:0;font:700 clamp(38px,5.4vw,64px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.025em">{{t.heroTitle}}</h1>
<p style="margin:0;max-width:480px;font-size:18px;color:var(--mut)">{{t.heroSub}}</p>

</div>
<div style="flex:1 1 400px;min-width:0;background:var(--surf);color:var(--tx);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px">
<div style="font:700 22px/1.2 'Space Grotesk',sans-serif">{{t.lookFor}}</div>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<template data-for="heroTabs" data-as="k">
<button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid {{k.bd}};background:{{k.bg}};color:{{k.fg}};font:600 13px 'Inter',sans-serif">{{k.label}}</button>
</template>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<label for="q-make" style="font:600 12px 'Inter',sans-serif;color:var(--mut)">{{t.fMake}}</label>
<select id="q-make" value="{{vMake}}" onChange="{{onMake}}" style="height:46px;box-sizing:border-box;width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);padding:0 12px;font:500 15px 'Inter',sans-serif">
<template data-for="makeOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
<div style="display:flex;gap:12px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<label for="q-year" style="font:600 12px 'Inter',sans-serif;color:var(--mut)">{{t.fYear}}</label>
<select id="q-year" value="{{vYear}}" onChange="{{onYear}}" style="height:46px;box-sizing:border-box;width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);padding:0 12px;font:500 15px 'Inter',sans-serif">
<template data-for="yearOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<label for="q-price" style="font:600 12px 'Inter',sans-serif;color:var(--mut)">{{t.qPrice}}</label>
<select id="q-price" value="{{vMax}}" onChange="{{onMax}}" style="height:46px;box-sizing:border-box;width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);padding:0 12px;font:500 15px 'Inter',sans-serif">
<template data-for="priceOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
</div>
<button onClick="{{goSearch}}" style="min-height:52px;border:0;border-radius:10px;background:var(--ac);color:#0B0D10;font:700 16px 'Inter',sans-serif">{{showLabel}}</button>
</div>
</section>

<section style="max-width:1160px;margin:0 auto;padding:24px 24px 8px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px">
<template data-for="tiles" data-as="k">
<button class="card" onClick="{{k.pick}}" style="text-align:left;background:{{k.bgc}};border:1px solid var(--bd);border-radius:16px;padding:16px;min-height:150px;color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden">
<span style="display:flex;flex-direction:column;gap:2px;position:relative;z-index:1">
<span style="font:700 19px/1.1 'Space Grotesk',sans-serif">{{k.label}}</span>
<span style="font:500 13px 'Inter',sans-serif;color:var(--mut)">{{k.sub}}</span>
</span>
<span style="align-self:flex-end;margin-right:-6px;margin-bottom:-8px"><template data-if="k.isCar"><svg viewBox="0 0 160 90" width="96" height="54" aria-hidden="true"><path d="M14 62 L30 40 Q36 32 50 32 L98 32 Q110 32 118 42 L136 48 Q148 50 148 60 L148 68 L14 68 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="46" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="116" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template><template data-if="k.isVan"><svg viewBox="0 0 160 90" width="96" height="54" aria-hidden="true"><path d="M10 24 L110 24 L110 68 L10 68 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><path d="M110 36 L136 36 Q148 38 150 52 L150 68 L110 68 Z" fill="#1A2A3D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="40" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="128" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template><template data-if="k.isTruck"><svg viewBox="0 0 160 90" width="96" height="54" aria-hidden="true"><path d="M6 16 L98 16 L98 66 L6 66 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><path d="M104 34 L134 34 Q148 36 150 50 L150 66 L104 66 Z" fill="#1A2A3D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="28" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="52" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="128" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template><template data-if="k.isParts"><svg viewBox="0 0 160 90" width="96" height="54" aria-hidden="true"><circle cx="80" cy="45" r="26" fill="none" stroke="#F07A1A" stroke-width="10"/><circle cx="80" cy="45" r="8" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><path d="M80 8 V20 M80 70 V82 M43 45 H55 M105 45 H117" stroke="#2F8FE0" stroke-width="10"/></svg></template><template data-if="k.isTires"><svg viewBox="0 0 160 90" width="96" height="54" aria-hidden="true"><circle cx="80" cy="45" r="34" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="80" cy="45" r="20" fill="var(--surf2)"/><circle cx="80" cy="45" r="6" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/></svg></template></span>
</button>
</template>
</div>
</section>



<section style="max-width:1160px;margin:0 auto;padding:44px 24px 8px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px">
<h2 style="margin:0;font:700 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em">{{t.featured}}</h2>
<button onClick="{{goCars}}" style="background:none;border:0;border-bottom:2px solid var(--tx);color:var(--tx);min-height:44px;font:600 15px 'Inter',sans-serif">{{t.viewAll}} →</button>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px">
<template data-for="featuredCars" data-as="c">
<button class="card" onClick="{{c.pick}}" style="text-align:left;background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:0;color:var(--tx);display:flex;flex-direction:column;overflow:hidden">
<div style="height:200px;width:100%;box-sizing:border-box;background:radial-gradient(260px 140px at 70% 95%,rgba(240,122,26,.28),transparent 70%),linear-gradient(160deg,var(--g1) 0%,var(--g2) 60%,var(--bg) 100%);display:flex;align-items:center;justify-content:center;position:relative">
<template data-if="c.isCar"><svg viewBox="0 0 160 90" width="250" height="141" aria-hidden="true"><path d="M14 62 L30 40 Q36 32 50 32 L98 32 Q110 32 118 42 L136 48 Q148 50 148 60 L148 68 L14 68 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="46" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="116" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template><template data-if="c.isVan"><svg viewBox="0 0 160 90" width="250" height="141" aria-hidden="true"><path d="M10 24 L110 24 L110 68 L10 68 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><path d="M110 36 L136 36 Q148 38 150 52 L150 68 L110 68 Z" fill="#1A2A3D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="40" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="128" cy="68" r="11" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template><template data-if="c.isTruck"><svg viewBox="0 0 160 90" width="250" height="141" aria-hidden="true"><path d="M6 16 L98 16 L98 66 L6 66 Z" fill="#22364D" stroke="#2F8FE0" stroke-width="1.5"/><path d="M104 34 L134 34 Q148 36 150 50 L150 66 L104 66 Z" fill="#1A2A3D" stroke="#2F8FE0" stroke-width="1.5"/><circle cx="28" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="52" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/><circle cx="128" cy="68" r="10" fill="#0B0D10" stroke="#F07A1A" stroke-width="3"/></svg></template>
<span style="position:absolute;left:14px;top:14px;background:var(--surf);color:var(--tx);font:600 12px 'Inter',sans-serif;padding:4px 10px;border-radius:999px">{{c.chip}}</span>
<span style="position:absolute;left:14px;bottom:14px;background:var(--ac);color:#0B0D10;font:700 16px 'Space Grotesk',sans-serif;padding:6px 14px;border-radius:999px">{{c.price}}</span>
</div>
<div style="padding:16px 18px 18px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:4px">
<div style="font:700 19px/1.2 'Space Grotesk',sans-serif">{{c.title}}</div>
<div style="color:var(--mut);font:400 13px/1.4 'Inter',sans-serif">{{c.sub}}</div>
</div>
</button>
</template>
</div>
</section>

<section style="max-width:1160px;margin:0 auto;padding:56px 24px 8px">
<div style="border-top:1px solid var(--bd)">
<div style="display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;padding:24px 0;border-bottom:1px solid var(--bd)">
<div style="flex:1 1 220px;font:700 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em">{{t.partsTitle}}</div>
<p style="flex:2 1 320px;margin:0;color:var(--mut);font-size:16px">{{t.partsLead}}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button onClick="{{goParts}}" style="min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--ac);color:#0B0D10;font:600 14px 'Inter',sans-serif">{{t.tabParts}} →</button>
<button onClick="{{goTires}}" style="min-height:44px;padding:0 20px;border:1.5px solid var(--tx);border-radius:999px;background:transparent;color:var(--tx);font:600 14px 'Inter',sans-serif">{{t.tabTires}} →</button>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;padding:24px 0;border-bottom:1px solid var(--bd)">
<div style="flex:1 1 220px;font:700 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em">{{t.sellBandTitle}}</div>
<p style="flex:2 1 320px;margin:0;color:var(--mut);font-size:16px">{{t.sellText}}</p>
<button onClick="{{goSell}}" style="min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--ac);color:#0B0D10;font:600 14px 'Inter',sans-serif">{{t.navSell}} →</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;padding:24px 0;border-bottom:1px solid var(--bd)">
<div style="flex:1 1 220px;font:700 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em">{{t.finTitle}}</div>
<p style="flex:2 1 320px;margin:0;color:var(--mut);font-size:16px">{{t.finLead}}</p>
<button onClick="{{goFinance}}" style="min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--ac);color:#0B0D10;font:600 14px 'Inter',sans-serif">{{t.navFinance}} →</button>
</div>
</div>
</section>

<section style="max-width:1160px;margin:0 auto;padding:56px 24px 72px">
<h2 style="margin:0 0 20px;font:700 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em">{{t.howTitle}}</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
<div style="background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:20px"><div style="font:700 40px/1 'Space Grotesk',sans-serif;color:#1A6FB8">1</div><p style="margin:10px 0 0;font-size:16px">{{t.how1}}</p></div>
<div style="background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:20px"><div style="font:700 40px/1 'Space Grotesk',sans-serif;color:#1A6FB8">2</div><p style="margin:10px 0 0;font-size:16px">{{t.how2}}</p></div>
<div style="background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:20px"><div style="font:700 40px/1 'Space Grotesk',sans-serif;color:#1A6FB8">3</div><p style="margin:10px 0 0;font-size:16px">{{t.how3}}</p></div>
</div>
</section>
</template>

<!-- ============ CARS ============ -->
<template data-if="isCars">
<section style="max-width:1100px;margin:0 auto;padding:32px 24px 64px">
<h1 style="margin:0 0 20px;font:700 38px/1.2 'Space Grotesk',sans-serif;">{{t.stockTitle}}</h1>
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<aside aria-label="{{t.filters}}" style="flex:0 1 300px;min-width:260px;background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px">
<div style="font:700 19px/1.2 'Inter',sans-serif;font-style:italic">{{t.filters}}</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<template data-for="catChips" data-as="k">
<button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{k.bd}};background:{{k.bg}};color:{{k.fg}};font:600 16px 'Inter',sans-serif;">{{k.label}}</button>
</template>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<template data-for="fuelChips" data-as="k">
<button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid {{k.bd}};background:{{k.bg}};color:{{k.fg}};font:600 15px 'Inter',sans-serif">{{k.label}}</button>
</template>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="f-make" style="font:600 13px 'Inter',sans-serif;color:var(--mut)">{{t.fMake}}</label>
<select id="f-make" value="{{vMake}}" onChange="{{onMake}}" style="height:48px;box-sizing:border-box;width:100%;background:var(--surf);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);padding:0 12px;font:500 16px 'Inter',sans-serif">
<template data-for="makeOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="f-year" style="font:600 13px 'Inter',sans-serif;color:var(--mut)">{{t.fYear}}</label>
<select id="f-year" value="{{vYear}}" onChange="{{onYear}}" style="height:48px;box-sizing:border-box;width:100%;background:var(--surf);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);padding:0 12px;font:500 16px 'Inter',sans-serif">
<template data-for="yearOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="f-km" style="font:600 13px 'Inter',sans-serif;color:var(--mut)">{{t.fMileage}}</label>
<select id="f-km" value="{{vKm}}" onChange="{{onKm}}" style="height:48px;box-sizing:border-box;width:100%;background:var(--surf);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);padding:0 12px;font:500 16px 'Inter',sans-serif">
<template data-for="kmOpts" data-as="o"><option value="{{o.v}}">{{o.l}}</option></template>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="f-price" style="font:600 13px 'Inter',sans-serif;color:var(--mut)">{{t.qPrice}}</label>

    const navItems = [["cars", T.navCars], ["parts", T.navParts], ["sell", T.navSell], ["finance", T.navFinance]].map(([v, label]) => {

    const langs = [["en","EN","English"],["it","IT","Italiano"],["ru","RU","Русский"],["et","ET","Eesti"]].map(([code, label, name]) => {

    const opts = (arr) => [{v:"", l:T.any}].concat(arr.map((x) => ({v:x, l:x})));
    const makeOpts = [{v:"", l:T.any}].concat(MAKES.map((m) => ({v:m, l:m})));

    const cnt = (cat) => CARS.filter((c) => c.cat === cat).length;
    const tiles = [
      {label:T.catNew, color:catColor.new, sub:cnt("new") + " ", pick:() => this.setState({view:"cars", cat:"new"})},

    ].map((k, i) => Object.assign(k, {sub: /^\d+ $/.test(k.sub) ? k.sub + T.offersWord : "", bgc: ["var(--t1)","var(--t2)","var(--t3)","var(--t1)","var(--t2)","var(--t3)","var(--t1)"][i], isCar: i < 3, isVan: i === 3, isTruck: i === 4, isParts: i === 5, isTires: i === 6}));

    const brandTiles = MAKES.map((m) => ({

    const featuredCars = ["n1","u1","r1","v2","t1","n3"].map((id) => mkCar(CARS.find((c) => c.id === id)));

    const heroTabs = [["all", T.catAll], ["new", T.catNew], ["used", T.catUsed], ["retro", T.catRetro], ["van", T.catVan], ["truck", T.catTruck]]
      .map(([k, label]) => heroChip(k, label, s.cat === k, () => this.setState({cat:k})));
    const catChips = [["all", T.catAll], ["new", T.catNew], ["used", T.catUsed], ["retro", T.catRetro], ["van", T.catVan], ["truck", T.catTruck]]
      .map(([k, label]) => chip(k, label, s.cat === k, () => this.setState({cat:k})));
    const fuelChips = [["all", T.catAll], ["petrol", T.fuelPetrol], ["diesel", T.fuelDiesel], ["hybrid", T.fuelHybrid], ["electric", T.fuelElectric]]
      .map(([k, label]) => chip(k, label, s.fuel === k, () => this.setState({fuel:k})));

    const d = CARS.find((c) => c.id === s.carId) || CARS[0];
    const detail = {
      title: d.title, price: eur(d.price), chip: catLabel[d.cat], chipBg: catColor[d.cat], isRetro: d.cat === "retro",
      isCar: d.shape === "car", isVan: d.shape === "van", isTruck: d.shape === "truck",
      rows: [
        {k:T.fYear, v:String(d.year)},
        {k:T.fMileage, v:fmtN(d.km) + " km"},
        {k:T.fFuel, v:fuelLabel[d.fuel]},
        {k:T.transLabel, v: d.trans === "auto" ? T.transAuto : T.transManual},
        {k:T.powerLabel, v:d.kw + " kW"}
      ]
    };

    const tabChips = [["parts", T.tabParts], ["tires", T.tabTires]].map(([k, label]) => chip(k, label, s.tab === k, () => this.setState({tab:k})));
    const pcLabels = [T.pcEngine, T.pcBrakes, T.pcSusp, T.pcBody, T.pcElec, T.pcFilters, T.pcRetro, T.pcTruck];
    const pcColors = ["#D63A14","#F2B705","#2E8FD0","#4FA84A","#7A8696","#D63A14","#F2B705","#4FA84A"];
    const partCats = pcLabels.map((label, i) => ({label, color: pcColors[i], pressed: s.pcat === i, bg: s.pcat === i ? "var(--surf2)" : "var(--surf)",
      pick: () => this.setState({pcat: s.pcat === i ? -1 : i})}));
    const partItems = PARTS.filter((p) => s.pcat < 0 || p.cat === s.pcat).map((p) => ({name: T[p.k], price: eur(p.price)}));

    const seasonLabel = {summer:T.sSummer, winter:T.sWinter, all:T.sAll};
    const seasonColor = {summer:"#FFD166", winter:"#8FD3F4", all:"#A7E08A"};
    const seasonChips = [["all", T.catAll], ["summer", T.sSummer], ["winter", T.sWinter], ["allseason", T.sAll]]
      .map(([k, label]) => chip(k, label, s.season === k, () => this.setState({season:k})));
    const tireItems = TIRES.filter((r) => (s.season === "all" || (s.season === "allseason" ? r.season === "all" : r.season === s.season))
      && (!s.tw || r.size.indexOf(s.tw + "/") === 0) && (!s.tp || r.size.indexOf("/" + s.tp + " ") > 0) && (!s.tr || r.size.indexOf(" " + s.tr) > 0))
      .map((r) => ({brand:r.brand, size:r.size, season:seasonLabel[r.season], chipBg:seasonColor[r.season], price: eur(r.price) + " / " + T.perTire}));

    const principal = Math.max(0, s.price - s.down);
    const rm = rate / 100 / 12;
    const monthly = principal === 0 ? 0 : (rm === 0 ? principal / s.term : principal * rm / (1 - Math.pow(1 + rm, -s.term)));

    return {
      t: T, accent, brand, th, themeBtns,
      isHome: s.view === "home", isCars: s.view === "cars", isDetail: s.view === "detail",
      isParts: s.view === "parts", isSell: s.view === "sell", isFinance: s.view === "finance",
      goHome: go("home"), goCars: () => this.setState({view:"cars", cat:"all", make:"", year:"", km:"", maxPrice:"", fuel:"all"}),
      goCarsKeep: go("cars"), goParts: () => this.setState({view:"parts", tab:"parts"}), goTires: () => this.setState({view:"parts", tab:"tires"}),
      goSell: go("sell"), goFinance: go("finance"), goSearch: go("cars"),
      navItems, langs, tiles, brandTiles, featuredCars, heroTabs, catChips, fuelChips,
      listCars: list.map(mkCar),

      twOpts: opts(["185","195","205","215","225","235","245"]), tpOpts: opts(["40","45","50","55","60","65"]), trOpts: opts(["R15","R16","R17","R18","R19","R20"]),

      onDown: (e) => this.setState({down: Number(e.target.value)}),
      onTerm: (e) => this.setState({term: Number(e.target.value)}),
      monthlyDisp: eur(Math.round(monthly)), loanDisp: eur(principal), rateDisp: rate + " %",
      langOpen: s.langOpen, toggleLang: () => this.setState({langOpen: !this.state.langOpen, menuOpen: false}), menuOpen: s.menuOpen, toggleMenu: () => this.setState({menuOpen: !this.state.menuOpen, langOpen: false}), curLang: s.lang.toUpperCase(), chatOpen: s.chat, toggleChat: () => this.setState({chat: !this.state.chat})
    };

<script>

(function(){
const VOID=new Set(['input','img','br','hr','link','meta']);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function look(path,ctx){const ps=path.trim().split('.');let v=ctx[ps[0]];for(let i=1;i<ps.length&&v!=null;i++)v=v[ps[i]];return v;}
const HOLE=/\{\{\s*([\w.]+)\s*\}\}/g;
let handlers=[];
function kids(n,ctx){let out='';const list=(n.tagName==='TEMPLATE'?n.content:n).childNodes;for(const c of list)out+=node(c,ctx);return out;}
function node(n,ctx){
 if(n.nodeType===3)return n.nodeValue.replace(HOLE,(_,p)=>{const v=look(p,ctx);return v==null?'':esc(v)});
 if(n.nodeType!==1)return '';
 const tag=n.tagName.toLowerCase();
 if(tag==='template'){
  if(n.hasAttribute('data-if'))return look(n.getAttribute('data-if'),ctx)?kids(n,ctx):'';
  if(n.hasAttribute('data-for')){const list=look(n.getAttribute('data-for'),ctx)||[];const as=n.getAttribute('data-as');let o='';list.forEach((it,i)=>{const c=Object.create(ctx);c[as]=it;c.index=i;o+=kids(n,c)});return o;}
  return '';
 }
 let a='';
 for(const at of n.attributes){
  const name=at.name;
  if(name==='onclick'||name==='onchange'){const mm=at.value.match(/^\{\{\s*([\w.]+)\s*\}\}$/);const fn=mm&&look(mm[1],ctx);if(fn){handlers.push(fn);a+=' data-h-'+name.slice(2)+'="'+(handlers.length-1)+'"';}continue;}
  const val=at.value.replace(HOLE,(_,p)=>{const v=look(p,ctx);return v==null?'':String(v)});
  a+=' '+name+'="'+esc(val)+'"';
  if(name==='value'&&tag==='select')a+=' data-value="'+esc(val)+'"';
 }
 return '<'+tag+a+'>'+(VOID.has(tag)?'':kids(n,ctx)+'</'+tag+'>');
}
const tpl=document.getElementById('tpl');
const root=document.getElementById('root');
let inst=null;
function render(){
 const fields=[...root.querySelectorAll('input,select,textarea')];
 const ai=fields.indexOf(document.activeElement);
 const ss=ai>=0?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
 const sy=window.scrollY;
 handlers=[];
 const v0=inst.state.view; if(v0!==window.__lv){window.__lv=v0;root.classList.add('enter');clearTimeout(window.__et);window.__et=setTimeout(()=>root.classList.remove('enter'),900);}
 const vals=inst.renderVals();
 root.innerHTML=kids(tpl,vals);
 root.querySelectorAll('select[data-value]').forEach(s=>{s.value=s.getAttribute('data-value')});
 if(ai>=0){const f=[...root.querySelectorAll('input,select,textarea')][ai];if(f){f.focus({preventScroll:true});try{if(ss&&ss[0]!=null)f.setSelectionRange(ss[0],ss[1]);}catch(e){}}}
 window.scrollTo(0,sy);
}
window.__render=render;
function fire(attr,e){const el=e.target.closest('[data-h-'+attr+']');if(el){const h=handlers[+el.getAttribute('data-h-'+attr)];if(h)h(e);}}
root.addEventListener('click',e=>fire('click',e));
root.addEventListener('change',e=>fire('change',e));
root.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='checkbox'&&t.type!=='radio'))fire('change',e);});
window.addEventListener('DOMContentLoaded',()=>{
 inst=new Component();
 render();
 if(inst.componentDidMount)inst.componentDidMount();
});
})();

</script>
